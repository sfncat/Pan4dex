[project]
name = "pan4dex"
version = "1.9.023"  # 与 config/app_config.py 的 VERSION 主版本号保持同步
description = "Pan4dex 万格 — 跨平台四窗格文件管理器"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "send2trash>=1.8.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.16.0",
    "qdarkstyle>=3.2.0",
    "pyte>=0.8.0",
    "pywinpty>=3.0.0; sys_platform == \"win32\"",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
# 跑测试用的依赖。仓库里没有 requirements-dev.txt，测试依赖只有这一处真相：
# `uv sync --extra dev`（PyInstaller 那批用 `--extra build`）
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.5",
]

[tool.uv]
package = false
